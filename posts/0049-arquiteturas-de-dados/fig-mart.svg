<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="O data warehouse central fatiado em data marts por área de negócio">
  <style>
    .painel { fill: #ffffff; stroke: #d8d2c6; stroke-width: 1; }
    .box { fill: #e8e2d4; stroke: #b8b09e; stroke-width: 1; }
    .sys { fill: #3d5a80; }
    .txt { font-size: 13px; fill: #3d3a33; text-anchor: middle; }
    .txtb { font-size: 14px; fill: #ffffff; text-anchor: middle; }
    .txtb-11 { font-size: 11px; fill: #ffffff; text-anchor: middle; }
    .linha { stroke: #b8b09e; stroke-width: 1.5; }
    .nota { font-size: 12px; fill: #6b6657; text-anchor: middle; font-style: italic; }
    .dot { fill: #b86b4b; }
    .m1 { animation: ate1 3.6s linear infinite; }
    .m2 { animation: ate2 3.6s linear infinite; animation-delay: 1.2s; }
    .m3 { animation: ate3 3.6s linear infinite; animation-delay: 2.4s; }
    @keyframes ate1 { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 88% { transform: translate(215px,-72px); opacity: 1; } 100% { transform: translate(230px,-77px); opacity: 0; } }
    @keyframes ate2 { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 88% { transform: translate(215px,0); opacity: 1; } 100% { transform: translate(230px,0); opacity: 0; } }
    @keyframes ate3 { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 88% { transform: translate(215px,72px); opacity: 1; } 100% { transform: translate(230px,77px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .m1, .m2, .m3 { animation: none; opacity: 0.5; } }
  </style>

  <rect class="painel" x="10" y="10" width="900" height="280" rx="8"/>

  <circle class="dot m1" cx="280" cy="128" r="5"/>
  <circle class="dot m2" cx="280" cy="150" r="5"/>
  <circle class="dot m3" cx="280" cy="172" r="5"/>

  <rect class="sys" x="90" y="104" width="190" height="92" rx="8"/>
  <text class="txtb" x="185" y="140">Data warehouse</text>
  <text class="txtb-11" x="185" y="162">toda a empresa,</text>
  <text class="txtb-11" x="185" y="178">todos os assuntos</text>

  <line class="linha" x1="280" y1="128" x2="500" y2="72"/>
  <line class="linha" x1="280" y1="150" x2="500" y2="150"/>
  <line class="linha" x1="280" y1="172" x2="500" y2="228"/>

  <rect class="box" x="500" y="52" width="170" height="40" rx="6"/>
  <text class="txt" x="585" y="77">Mart de vendas</text>
  <rect class="box" x="500" y="130" width="170" height="40" rx="6"/>
  <text class="txt" x="585" y="155">Mart financeiro</text>
  <rect class="box" x="500" y="208" width="170" height="40" rx="6"/>
  <text class="txt" x="585" y="233">Mart de marketing</text>

  <text class="nota" x="760" y="77">o time de vendas</text>
  <text class="nota" x="760" y="155">o time financeiro</text>
  <text class="nota" x="760" y="233">o time de marketing</text>


  <text class="nota" x="380" y="272">o mesmo desenho, recortado por assunto: cada área consulta só a sua fatia</text>
</svg>
