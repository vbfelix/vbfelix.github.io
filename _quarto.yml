project:
  type: website
  output-dir: docs
  post-render:
    - scripts/build-agent-assets.ts
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "portfolio/**/*.qmd"
  resources:
    - pt-br/*.html
    - assets/js/portrait-bootstrap.js
    - assets/js/archive-filters.js
    - images/chalk-distributions.svg
    - .nojekyll

website:
  title: "Vinícius Félix"
  description: "Estatístico e mestre em Bioestatística, com experiência em pesquisa, engenharia de dados e produto."
  open-graph: true
  site-url: https://vbfelix.github.io
  favicon: images/favicon/chalk-scatter.svg
  search: false
  page-footer:
    left: "© Vinícius Félix · [Quarto](https://quarto.org/) · [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)"
    center:
      - text: Portfólio
        href: portfolio.qmd
      - text: Blog
        href: writing.qmd
      - text: Experiência
        href: header-experience.qmd
    right:
      - text: Para agentes
        href: agents.qmd
      - text: Currículo (Markdown)
        href: /curriculo.md
      - text: Currículo (JSON)
        href: /curriculo.json
  navbar:
    title: "Vinícius Félix"
    pinned: true
    left:
      - text: Sobre mim
        href: index.qmd
      - portfolio.qmd
      - text: Blog
        href: writing.qmd
      - header-certifications.qmd
      - text: Outros
        menu:
          - text: Participações
            href: header-participations.qmd
          - text: Cursos
            href: header-courses.qmd
          - text: Publicações
            href: header-publications.qmd
          - text: Prêmios
            href: header-awards.qmd
    right:
      - icon: github
        aria-label: "GitHub"
        href: https://github.com/vbfelix
        target: _blank
        rel: noopener
      - icon: linkedin
        aria-label: "LinkedIn"
        href: https://www.linkedin.com/in/vin%C3%ADcius-f%C3%A9lix-962010140/
        target: _blank
        rel: noopener
      - icon: stack-overflow
        aria-label: "Stack Overflow"
        href: https://stackoverflow.com/users/9696037/vin%c3%adcius-f%c3%a9lix
        target: _blank
        rel: noopener
      - icon: box-seam
        aria-label: "relper, pacote R"
        href: https://vbfelix.github.io/relper
        target: _blank
        rel: noopener

format:
  html:
    filters:
      - scripts/filters/breadcrumbs.lua
      - scripts/filters/records.lua
    theme: custom_theme.scss
    css: styles.css
    include-before-body: _includes/skip-link.html
    toc: true
    lang: pt

editor: visual
