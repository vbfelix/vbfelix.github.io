<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="No espresso a pressão empurra a água através da pastilha compactada em segundos: pressão no lugar de tempo">
  <style>
    .painel { fill: #ffffff; stroke: #d8d2c6; stroke-width: 1; }
    .maquina { fill: #e8e2d4; stroke: #b8b09e; stroke-width: 2; }
    .pastilha { fill: #b86b4b; }
    .agua { fill: #3d5a80; }
    .crema { fill: #d9a86b; }
    .fluxo { stroke: #3d5a80; stroke-width: 2.5; fill: none; }
    .txt { font-size: 13px; fill: #3d3a33; text-anchor: middle; }
    .nota { font-size: 12px; fill: #6b6657; text-anchor: middle; font-style: italic; }
    .vidro { fill: none; stroke: #b8b09e; stroke-width: 2; }
    .seta { fill: #3d5a80; }
    .p1 { animation: pressao 1.6s linear infinite; }
    .p2 { animation: pressao 1.6s linear infinite; animation-delay: 0.8s; }
    @keyframes pressao { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 85% { transform: translate(0,110px); opacity: 1; } 100% { transform: translate(0,120px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1, .p2 { animation: none; opacity: 0.5; } }
  </style>

  <rect class="painel" x="10" y="10" width="900" height="300" rx="8"/>

  <!-- grupo e pastilha -->
  <rect class="maquina" x="360" y="60" width="200" height="50" rx="6"/>
  <text class="txt" x="460" y="90">água a 8 a 10 bar</text>
  <path class="seta" d="M 410 118 L 420 134 L 400 134 Z"/>
  <path class="seta" d="M 510 118 L 520 134 L 500 134 Z"/>

  <rect class="maquina" x="380" y="140" width="160" height="44" rx="4"/>
  <rect class="pastilha" x="392" y="148" width="136" height="28" rx="3"/>
  <text class="nota" x="652" y="158">pastilha de pó fino,</text>
  <text class="nota" x="652" y="176">compactada</text>
  <text class="nota" x="268" y="158">25 a 30 segundos</text>
  <text class="nota" x="268" y="176">do início ao fim</text>

  <circle class="agua p1" cx="448" cy="130" r="4"/>
  <circle class="agua p2" cx="472" cy="130" r="4"/>

  <!-- xícara com crema -->
  <path class="vidro" d="M 420 230 L 428 292 L 492 292 L 500 230"/>
  <g data-figura="ilustracao">
    <rect class="agua" x="428" y="252" width="64" height="34" opacity="0.7"/>
    <rect class="crema" x="426" y="240" width="68" height="12" rx="3"/>
  </g>
  <text class="nota" x="610" y="250">a crema: espuma que só</text>
  <text class="nota" x="610" y="268">a pressão produz</text>

  <text class="txt" x="460" y="40">pressão no lugar de tempo: a extração inteira cabe em meio minuto</text>
</svg>
