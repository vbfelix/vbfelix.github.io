source:
  path: C:/Users/Vinícius/Desktop/vfx-llm-skills
  ref: v2.4.0
platforms:
- codex
- claude-code
use:
  skills:
  - create-branch
  - create-commit
  - finish-branch
  - write-tests
  - write-content
  - verify-change
  - debug-defect
  - publish-changes
config:
  verify-change:
    testes:
      comando:
      - powershell
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - scripts/site.ps1
      - -Action
      - test
      diretorio: .
      timeout: 300
    conferencia:
      comando:
      - powershell
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - scripts/site.ps1
      - -Action
      - check
      diretorio: .
      timeout: 600
    proporcional:
      comando:
      - powershell
      - -NoProfile
      - -ExecutionPolicy
      - Bypass
      - -File
      - scripts/site.ps1
      - -Action
      - verify
      - -Scope
      - staged
      diretorio: .
      timeout: 900
  write-content:
    criterios:
    - .agents/skills/ghost-writer/SKILL.md
    - CONTRIBUTING.md
