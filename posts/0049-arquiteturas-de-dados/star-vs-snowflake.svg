<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="A mesma venda nos dois desenhos: no star schema, a dimensão produto em tabela única; no snowflake, a hierarquia normalizada em tabelas ligadas por chaves">
  <style>
    .painel { fill: #ffffff; stroke: #d8d2c6; stroke-width: 1; }
    .titulo { font-size: 17px; fill: #3d3a33; font-weight: bold; text-anchor: middle; }
    .fato { fill: #3d5a80; }
    .dim { fill: #e8e2d4; stroke: #b8b09e; stroke-width: 1; }
    .sub { fill: #f4f0e6; stroke: #b8b09e; stroke-width: 1; stroke-dasharray: 4 3; }
    .txtfato { font-size: 14px; fill: #ffffff; text-anchor: middle; }
    .txtfato-11 { font-size: 11px; fill: #ffffff; text-anchor: middle; }
    .txtdim { font-size: 13px; fill: #3d3a33; text-anchor: middle; }
    .linha { stroke: #8a8374; stroke-width: 1.5; }
    .nota { font-size: 12px; fill: #6b6657; text-anchor: middle; font-style: italic; }
    .dot { fill: #b86b4b; }
    .j1 { animation: junta1 3s linear infinite; }
    .j2 { animation: junta2 3s linear infinite; animation-delay: 1s; }
    .j3 { animation: junta3 3s linear infinite; animation-delay: 2s; }
    .k1 { animation: cadeia 4.5s linear infinite; }
    .k2 { animation: junta2 4.5s linear infinite; animation-delay: 1.5s; }
    .k3 { animation: junta3 4.5s linear infinite; animation-delay: 3s; }
    @keyframes junta1 { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 85% { transform: translate(0,110px); opacity: 1; } 100% { transform: translate(0,122px); opacity: 0; } }
    @keyframes junta2 { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 85% { transform: translate(121px,-111px); opacity: 1; } 100% { transform: translate(135px,-123px); opacity: 0; } }
    @keyframes junta3 { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: 1; } 85% { transform: translate(-121px,-111px); opacity: 1; } 100% { transform: translate(-135px,-123px); opacity: 0; } }
    @keyframes cadeia { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 35% { transform: translate(-125px,0); } 60% { transform: translate(-255px,0); } 92% { transform: translate(-130px,122px); opacity: 1; } 100% { transform: translate(-126px,126px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .j1, .j2, .j3, .k1, .k2, .k3 { animation: none; opacity: 0.5; } }
  </style>

  <rect class="painel" x="10" y="10" width="440" height="420" rx="8"/>
  <rect class="painel" x="470" y="10" width="440" height="420" rx="8"/>

  <text class="titulo" x="230" y="42">Star schema</text>
  <text class="titulo" x="690" y="42">Snowflake schema</text>

  <line class="linha" x1="230" y1="215" x2="230" y2="93"/>
  <line class="linha" x1="230" y1="215" x2="95" y2="338"/>
  <line class="linha" x1="230" y1="215" x2="365" y2="338"/>

  <line class="linha" x1="690" y1="215" x2="565" y2="93"/>
  <line class="linha" x1="565" y1="93" x2="695" y2="93"/>
  <line class="linha" x1="695" y1="93" x2="820" y2="93"/>
  <line class="linha" x1="690" y1="215" x2="555" y2="338"/>
  <line class="linha" x1="690" y1="215" x2="825" y2="338"/>

  <circle class="dot j1" cx="230" cy="93" r="5"/>
  <circle class="dot j2" cx="95" cy="338" r="5"/>
  <circle class="dot j3" cx="365" cy="338" r="5"/>
  <circle class="dot k1" cx="820" cy="93" r="5"/>
  <circle class="dot k2" cx="555" cy="338" r="5"/>
  <circle class="dot k3" cx="825" cy="338" r="5"/>

  <rect class="fato" x="165" y="190" width="130" height="50" rx="6"/>
  <text class="txtfato" x="230" y="211">Fato Vendas</text>
  <text class="txtfato-11" x="230" y="228">grão: item por pedido</text>

  <rect class="dim" x="175" y="75" width="110" height="36" rx="6"/>
  <text class="txtdim" x="230" y="98">Dim Produto</text>

  <rect class="dim" x="35" y="320" width="120" height="36" rx="6"/>
  <text class="txtdim" x="95" y="343">Dim Cliente</text>

  <rect class="dim" x="305" y="320" width="120" height="36" rx="6"/>
  <text class="txtdim" x="365" y="343">Dim Data</text>

  <text class="nota" x="230" y="400">cada dimensão em tabela única,</text>
  <text class="nota" x="230" y="416">ligada direto à tabela fato</text>

  <rect class="fato" x="625" y="190" width="130" height="50" rx="6"/>
  <text class="txtfato" x="690" y="211">Fato Vendas</text>
  <text class="txtfato-11" x="690" y="228">grão: item por pedido</text>

  <rect class="dim" x="510" y="75" width="110" height="36" rx="6"/>
  <text class="txtdim" x="565" y="98">Dim Produto</text>

  <rect class="sub" x="640" y="75" width="110" height="36" rx="6"/>
  <text class="txtdim" x="695" y="98">Subcategoria</text>

  <rect class="sub" x="770" y="75" width="100" height="36" rx="6"/>
  <text class="txtdim" x="820" y="98">Categoria</text>

  <rect class="dim" x="495" y="320" width="120" height="36" rx="6"/>
  <text class="txtdim" x="555" y="343">Dim Cliente</text>

  <rect class="dim" x="765" y="320" width="120" height="36" rx="6"/>
  <text class="txtdim" x="825" y="343">Dim Data</text>

  <text class="nota" x="690" y="400">a hierarquia do produto sai da dimensão</text>
  <text class="nota" x="690" y="416">e vira tabelas normalizadas, ligadas por chaves</text>
</svg>
