<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" fill="none">
<g fill="#d5e2cd" font-family="Georgia,serif" font-style="italic" font-size="23" opacity=".22">
<text x="45" y="120" transform="rotate(-5 45 120)">X ∼ N(μ, σ²)</text>
<text x="1110" y="210" transform="rotate(4 1110 210)">X ∼ Bern(p)</text>
<text x="54" y="730" transform="rotate(-3 54 730)">X ∼ Pois(λ)</text>
<text x="1100" y="810" transform="rotate(3 1100 810)">X ∼ Exp(λ)</text>
<text x="470" y="1030" transform="rotate(-2 470 1030)">X ∼ Bin(n, p)</text>
</g>
<g fill="#e8d99a" font-family="Georgia,serif" font-style="italic" font-size="18" opacity=".17">
<text x="46" y="163" transform="rotate(-5 46 163)">E[X] = μ</text>
<text x="1110" y="245" transform="rotate(4 1110 245)">Var(X) = p(1 − p)</text>
<text x="52" y="765" transform="rotate(-3 52 765)">E[X] = Var(X) = λ</text>
<text x="1100" y="845" transform="rotate(3 1100 845)">f(x) = λe<tspan baseline-shift="super" font-size="12">−λx</tspan><tspan> , x ≥ 0</tspan></text>
<text x="680" y="1025">E[X] = np</text>
</g>
<g fill="#d5e2cd" font-family="Georgia,serif" font-style="italic" font-size="21" opacity=".18">
<text x="410" y="78" transform="rotate(-3 410 78)">P(A | B) = P(B | A) P(A) / P(B)</text>
<text x="875" y="110" transform="rotate(3 875 110)">E[X̄] = μ</text>
<text x="42" y="422" transform="rotate(-4 42 422)">yᵢ = β₀ + β₁xᵢ + εᵢ</text>
<text x="1090" y="490" transform="rotate(3 1090 490)">SE(X̄) = σ / √n</text>
<text x="56" y="581" transform="rotate(-2 56 581)">ρ = Cov(X, Y) / (σₓσᵧ)</text>
<text x="1090" y="655" transform="rotate(-3 1090 655)">S(t) = P(T &gt; t)</text>
<text x="400" y="925" transform="rotate(2 400 925)">θ̂ = arg max L(θ)</text>
<text x="760" y="955" transform="rotate(-3 760 955)">Var(X̄) = σ² / n</text>
</g>
<g fill="#e8d99a" font-family="Georgia,serif" font-style="italic" font-size="17" opacity=".15">
<text x="48" y="460" transform="rotate(-4 48 460)">εᵢ ∼ N(0, σ²)</text>
<text x="1090" y="528" transform="rotate(3 1090 528)">z = (x − μ) / σ</text>
<text x="58" y="619" transform="rotate(-2 58 619)">Cov(X, Y) = E[XY] − E[X]E[Y]</text>
<text x="1090" y="690" transform="rotate(-3 1090 690)">h(t) = f(t) / S(t)</text>
</g>
<g stroke="#d5e2cd" stroke-width="1.6" opacity=".18" stroke-linecap="round">
