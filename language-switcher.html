<script>
(() => {
  const STORAGE_KEY = "vbfelix-language";
  const PORTUGUESE_SEGMENT = "/pt-br/";
  const labels = {
    "header-about.html": { en: "About me", pt: "Sobre mim" },
    "header-publications.html": { en: "Publications", pt: "Publicações" },
    "header-certifications.html": { en: "Certifications", pt: "Certificações" },
    "header-participations.html": { en: "Participations", pt: "Participações" },
    "header-awards.html": { en: "Awards", pt: "Prêmios" }
  };

  const nav = document.querySelector("#navbarCollapse .navbar-nav");
  if (!nav) return;

  const institutionalPages = new Set(Object.keys(labels));
  const currentFilename = window.location.pathname.split("/").pop() || "index.html";
  const isPortuguesePage = window.location.pathname.includes(PORTUGUESE_SEGMENT);

  const getSavedLanguage = () => {
    try {
      return localStorage.getItem(STORAGE_KEY) === "pt-BR" ? "pt-BR" : "en";
    } catch (_) {
      return "en";
    }
  };

  const saveLanguage = (language) => {
    try {
      localStorage.setItem(STORAGE_KEY, language);
    } catch (_) {
      // The switch still works when browser storage is unavailable.
    }
  };

  const item = document.createElement("li");
  item.className = "nav-item language-switcher-item";

  const button = document.createElement("button");
  button.className = "nav-link language-switcher";
  button.type = "button";
  item.appendChild(button);

  const firstCompactItem = nav.querySelector(".nav-item.compact");
  nav.insertBefore(item, firstCompactItem);

  const applyLanguage = (language) => {
    const isPortuguese = language === "pt-BR";

    nav.querySelectorAll("a.nav-link[href]").forEach((link) => {
      const url = new URL(link.href, window.location.href);
      const filename = url.pathname.split("/").pop() || "index.html";
      const translation = labels[filename];
      const text = link.querySelector(".menu-text");

      if (translation && text) {
        text.textContent = isPortuguese ? translation.pt : translation.en;
        if (isPortuguese && !url.pathname.includes(PORTUGUESE_SEGMENT)) {
          url.pathname = url.pathname.replace(/\/([^/]+)$/, `${PORTUGUESE_SEGMENT}$1`);
        } else if (!isPortuguese) {
          url.pathname = url.pathname.replace(PORTUGUESE_SEGMENT, "/");
        }
        link.href = url.href;
      }
    });

    const footer = document.querySelector(".nav-footer-left p");
    if (footer) {
      footer.dataset.english = footer.dataset.english || footer.innerHTML;
      footer.innerHTML = isPortuguese
        ? footer.dataset.english
            .replace("Blog made with", "Blog criado com")
            .replace(", by", ", por")
            .replace("License:", "Licença:")
        : footer.dataset.english;
    }

    button.innerHTML = isPortuguese
      ? '<span aria-hidden="true">🇺🇸</span><span>EN</span>'
      : '<span aria-hidden="true">🇧🇷</span><span>PT-BR</span>';
    button.setAttribute(
      "aria-label",
      isPortuguese ? "Alterar o site para inglês" : "Alterar o site para português brasileiro"
    );
    button.dataset.language = language;
  };

  let language = isPortuguesePage ? "pt-BR" : getSavedLanguage();
  if (isPortuguesePage) saveLanguage(language);

  if (!isPortuguesePage && language === "pt-BR" && institutionalPages.has(currentFilename)) {
    const target = new URL(window.location.href);
    target.pathname = target.pathname.replace(/\/([^/]+)$/, `${PORTUGUESE_SEGMENT}$1`);
    window.location.replace(target.href);
    return;
  }

  applyLanguage(language);

  button.addEventListener("click", () => {
    language = language === "pt-BR" ? "en" : "pt-BR";
    saveLanguage(language);

    if (institutionalPages.has(currentFilename)) {
      const target = new URL(window.location.href);
      target.pathname = language === "pt-BR"
        ? target.pathname.replace(/\/([^/]+)$/, `${PORTUGUESE_SEGMENT}$1`)
        : target.pathname.replace(PORTUGUESE_SEGMENT, "/");
      window.location.assign(target.href);
      return;
    }

    applyLanguage(language);
  });
})();
</script>
